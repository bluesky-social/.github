name: claude-review

# Claude review of this repository's own pull requests, through the reusable
# workflow at the same commit. Guidance: .github/claude-review-prompt.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review:
    uses: ./.github/workflows/claude-review.yml
    permissions:
      contents: read
      pull-requests: write
      actions: read
    secrets:
      AGENT_GATEWAY_CLAUDE_GH_REVIEW_KEY: ${{ secrets.AGENT_GATEWAY_CLAUDE_GH_REVIEW_KEY }}
