self-hosted-runner:
  # Hosted labels newer than actionlint.
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/release-please.yml:
    ignore:
      # GitHub provides job.workflow_repository and job.workflow_sha in
      # reusable workflows; actionlint 1.7.12 does not know them yet.
      - 'property "workflow_(repository|sha)" is not defined'
